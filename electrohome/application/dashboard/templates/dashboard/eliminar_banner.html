{% extends "dashboard/base.html" %}
{% block title %}Eliminar Banner{% endblock %}
{% block content %}

<div class="eh-page-header">
    <h1 class="eh-page-title">
        <i class="fas fa-trash me-2" style="color:#ef4444"></i>Eliminar Banner
    </h1>
</div>

<div class="eh-card" style="max-width:480px;">
    <div style="text-align:center;padding:1rem 0 1.5rem;">
        <div style="font-size:3rem;margin-bottom:1rem;">🗑️</div>
        <p style="font-size:1rem;color:#374151;margin-bottom:0.5rem;">
            ¿Eliminar el banner <strong style="color:#1e3a8a;">{{ banner.titulo }}</strong>?
        </p>
        <p style="font-size:0.85rem;color:#94a3b8;">
            Esta acción no se puede deshacer.
        </p>
    </div>
    <form method="post" style="display:flex;gap:12px;justify-content:center;">
        {% csrf_token %}
        <button type="submit" class="eh-btn-danger">
            <i class="fas fa-trash"></i> Sí, eliminar
        </button>
        <a href="{% url 'dashboard:secciones' %}" class="eh-btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
